<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none">
  <defs>
    <!-- Background gradients -->
    <linearGradient id="bg-base" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="55%" stop-color="#0f1526" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <radialGradient id="glow-indigo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(920 260) rotate(135) scale(520 380)">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-emerald" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 520) rotate(25) scale(380 260)">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="logo-grad" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="accent-line" x1="80" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="card-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131c31" />
      <stop offset="100%" stop-color="#0d1322" />
    </linearGradient>

    <!-- 24px subtle dot/grid canvas pattern at 6% opacity -->
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#94a3b8" fill-opacity="0.12" />
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#94a3b8" stroke-opacity="0.05" stroke-width="1" />
    </pattern>

    <!-- Drop shadows -->
    <filter id="shadow-lg" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.65" />
    </filter>
    <filter id="shadow-md" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1280" height="640" fill="url(#bg-base)" />
  <rect width="1280" height="640" fill="url(#dot-grid)" />
  <rect width="1280" height="640" fill="url(#glow-indigo)" />
  <rect width="1280" height="640" fill="url(#glow-emerald)" />

  <!-- Subtle outer frame -->
  <rect x="24" y="24" width="1232" height="592" rx="20" stroke="#1e293b" stroke-width="1" stroke-opacity="0.7" />

  <!-- ========================================================= -->
  <!-- LEFT COLUMN (Safe zone x=80..565, y=72..568)              -->
  <!-- ========================================================= -->

  <!-- Top Pill Badge -->
  <g transform="translate(80, 78)">
    <rect width="368" height="32" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
    <circle cx="18" cy="16" r="4.5" fill="#10b981" />
    <circle cx="18" cy="16" r="8" fill="#10b981" fill-opacity="0.2" />
    <text x="32" y="20.5" fill="#cbd5e1" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.1">OPEN SOURCE • LOCAL-FIRST • MIT LICENSE</text>
  </g>

  <!-- Brand Logo Mark + Wordmark -->
  <g transform="translate(80, 142)">
    <!-- Geometric Studio Icon -->
    <rect width="58" height="58" rx="14" fill="url(#logo-grad)" />
    <rect x="1" y="1" width="56" height="56" rx="13" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
    <!-- Stylized Artboard/F Nodes inside logo -->
    <rect x="14" y="14" width="16" height="12" rx="3" fill="#ffffff" />
    <rect x="34" y="14" width="10" height="30" rx="3" fill="#ffffff" fill-opacity="0.35" />
    <rect x="14" y="30" width="16" height="14" rx="3" fill="#ffffff" fill-opacity="0.85" />
    <circle cx="39" cy="19" r="2.2" fill="#ffffff" />

