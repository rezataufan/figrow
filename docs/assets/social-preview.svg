    <rect x="12" y="11" width="24" height="24" rx="6" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-opacity="0.4" />
    <text x="18.5" y="27.5" fill="#34d399" font-family="'Segoe UI Symbol', sans-serif" font-size="13">★</text>
    <text x="48" y="28" fill="#f1f5f9" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="600">
