  </g>

  <!-- Subtitle -->
  <text x="80" y="244" fill="#94a3b8" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="600" letter-spacing="-0.3">Visual DOM &amp; CSS Studio</text>

  <!-- Accent Divider -->
  <rect x="80" y="266" width="440" height="2" rx="1" fill="url(#accent-line)" />

  <!-- Architecture / Feature Chips (2x2 clean grid) -->
  <g transform="translate(80, 294)" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="600">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="212" height="38" rx="9" fill="#111827" stroke="#334155" stroke-width="1" />
    <circle cx="18" cy="19" r="4" fill="#6366f1" />
    <text x="32" y="23.5" fill="#e2e8f0">Multi-Artboard Canvas</text>

    <!-- Chip 2 -->
    <rect x="224" y="0" width="218" height="38" rx="9" fill="#111827" stroke="#334155" stroke-width="1" />
    <circle cx="242" cy="19" r="4" fill="#10b981" />
    <text x="256" y="23.5" fill="#e2e8f0">parse5 + PostCSS AST</text>

    <!-- Chip 3 -->
    <rect x="0" y="50" width="176" height="38" rx="9" fill="#111827" stroke="#334155" stroke-width="1" />
    <circle cx="18" cy="69" r="4" fill="#06b6d4" />
    <text x="32" y="73.5" fill="#e2e8f0">Yjs CRDT History</text>

    <!-- Chip 4 -->
    <rect x="188" y="50" width="194" height="38" rx="9" fill="#111827" stroke="#334155" stroke-width="1" />
    <circle cx="206" cy="69" r="4" fill="#f59e0b" />
    <text x="220" y="73.5" fill="#e2e8f0">WebMCP AI Ready</text>
  </g>

  <!-- Value Prop Micro-Summary -->
  <text x="80" y="424" fill="#94a3b8" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="400">
    Lossless HTML5 &amp; CSS round-trip editing via exact byte-range
  </text>
  <text x="80" y="447" fill="#94a3b8" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="400">
    splicing. Zero proprietary lock-in — your files stay pure code.
  </text>

  <!-- Contributor Callout Ribbon (Bottom-Left inside safe zone) -->
  <g transform="translate(80, 492)">
    <rect width="468" height="46" rx="11" fill="#0f172a" stroke="#6366f1" stroke-opacity="0.55" stroke-width="1.2" />
    <rect x="1" y="1" width="466" height="44" rx="10" fill="#6366f1" fill-opacity="0.08" />
